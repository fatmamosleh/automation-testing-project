name: End-to-end test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run end-to-end purchase test
        run: mvn --batch-mode --no-transfer-progress test -Dgroups=e2e -Dluma.headless=true
